name: opi5max-panthor-build

# Build an Orange Pi 5 Max (RK3588) Ubuntu 26.04 (resolute) image from the
# MAINLINE stack:
#   - linux-7.2.y kernel (CONFIG_DRM_PANTHOR=m, no vendor Mali bifrost)
#   - Mesa (panfrost gallium + PanVK) built from source
#   - Ubuntu "resolute" (26.04) server rootfs
# Runs on a native arm64 GitHub-hosted runner (fast network, no emulation).
#
# Every run publishes a PUBLIC Release containing the image + manifests + the
# full build.log, so results are retrievable without repo admin rights.
#
# Trigger: push to the opi5max-panthor branch, or manual workflow_dispatch.

on:
  workflow_dispatch:
    inputs:
      mesa_source:
        description: 'Mesa source: upstream = Debian mesa 26.1.6, ubuntu = distro mesa'
        required: true
        default: 'upstream'
        type: choice
        options:
          - upstream
          - ubuntu
  push:
    branches:
      - opi5max-panthor

permissions:
  contents: write   # publish a Release

jobs:
  build:
    name: Orange Pi 5 Max mainline (Panthor) image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare build tree
        run: |
          mkdir -p build/overlay build/kernel build/images
          cp *.sh build/
          cp my-add.txt build/overlay/
          # mesa-build-env.sh does: cp staging_panthor_mesa.sh overlay/libdrm-amdgpu1.symbols.patch $1
          # so the symbols patch MUST live in build/overlay/ (it runs with set -eE).
          cp libdrm-amdgpu1.symbols.patch build/overlay/
          cd build
          chmod +x *.sh

      - name: Build Max image (U-Boot + linux-7.2.y kernel + Mesa + rootfs + disk image)
        env:
          mesa_source: ${{ github.event.inputs.mesa_source || 'upstream' }}
        run: |
          cd build
          set -o pipefail
          ./build-opi5max.sh "$mesa_source" 2>&1 | tee build.log

      - name: Fix artifact ownership (build ran under sudo/root)
        if: always()
        run: sudo chown -R runner:runner build/overlay build/images build/kernel build/build.log 2>/dev/null || true

      - name: Kernel .config audit (Panthor / DRM / redroid deps) — checklist Gate 0 evidence
        if: always()
        run: |
          cd build
          if [ -f overlay/kernel-built-.config ]; then
            ./check-kernel-config.sh overlay/kernel-built-.config 2>&1 | tee overlay/kernel-config-audit.txt || true
          else
            echo "no kernel .config captured (build likely failed before the kernel step)" | tee overlay/kernel-config-audit.txt
          fi

      - name: Summarize artifacts
        if: always()
        run: |
          echo "===== images =====";     ls -lh build/images/  || true
          echo "===== overlay =====";    ls -lh build/overlay/ || true
          echo "===== kernel debs =====";ls -lh build/kernel/  || true
          echo "===== build-versions.txt ====="; cat build/overlay/build-versions.txt || true
          echo "===== kernel-config-audit (tail) ====="; tail -40 build/overlay/kernel-config-audit.txt || true
          echo "===== build.log (tail) ====="; tail -60 build/build.log || true

      - name: Upload artifacts (image + manifests + logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opi5max-panthor-image
          path: |
            build/images/*.img.xz
            build/overlay/build-versions.txt
            build/overlay/kernel-built-.config
            build/overlay/kernel-config-audit.txt
            build/overlay/orangepi-5-MAX-u-boot-rockchip.bin
            build/build.log
          if-no-files-found: warn
          retention-days: 30

      # Publish on EVERY run (success -> image+manifests+log; failure -> at least
      # build.log) so results are downloadable without repo admin rights.
      - name: Publish Release (public, retrievable without auth)
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: opi5max-panthor-${{ github.run_number }}
          name: Orange Pi 5 Max Panthor image (run ${{ github.run_number }} / ${{ github.run_attempt }})
          body: |
            Orange Pi 5 Max (RK3588) Ubuntu 26.04 (resolute) image, mainline Panthor/PanVK stack.

            - Job conclusion: `${{ job.status }}`
            - Mesa source: `${{ github.event.inputs.mesa_source || 'upstream' }}`
            - Commit: `${{ github.sha }}`
            - `build-versions.txt`: exact linux / u-boot / rkbin commit SHAs
            - `kernel-config-audit.txt`: Panthor / DRM / reDroid kernel-config check (Gate 0)
            - `build.log`: full build output (present even on failure)
            - `*.img.xz`: the disk image (present only on success)
          draft: false
          prerelease: true
          fail_on_unmatched_files: false
          files: |
            build/images/*.img.xz
            build/overlay/build-versions.txt
            build/overlay/kernel-config-audit.txt
            build/overlay/orangepi-5-MAX-u-boot-rockchip.bin
            build/build.log
